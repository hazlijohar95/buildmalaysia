[project]
name = "pipeline"
version = "0.1.0"
description = "Extracts Malaysian federal budget and spending figures from official PDFs into Postgres."
requires-python = ">=3.12,<3.13"
dependencies = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
